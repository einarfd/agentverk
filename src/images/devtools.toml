# Development tools mixin.
# Installs git, git-delta, curl, build tools, fzf, direnv, tmux, plus
# commandline utilities: ripgrep, jq, fd, tree, shellcheck, sqlite3.
# Use via: include = ["devtools"]

notes = [
  "Installs: git, git-delta, curl, build tools (gcc/make), fzf, direnv, tmux, ripgrep, jq, fd, tree, shellcheck, sqlite3.",
]

[os_families.debian]
# Debian ships fd as `fdfind` (namespace conflict with an old init
# replacement); symlink to /usr/local/bin/fd so the canonical name works.
# git-delta isn't in bookworm or bookworm-backports (only trixie/sid), so
# fetch the latest .deb straight from upstream releases.
[[os_families.debian.setup]]
run = """
set -euo pipefail
apt-get update
apt-get install -y \
  git curl build-essential fzf direnv tmux \
  ripgrep jq fd-find tree shellcheck sqlite3
ln -sf /usr/bin/fdfind /usr/local/bin/fd

arch=$(dpkg --print-architecture)
delta_url=$(curl -fsSL https://api.github.com/repos/dandavison/delta/releases/latest \
  | jq -r --arg arch "$arch" '.assets[] | select(.name | test("^git-delta_[0-9.]+_" + $arch + "\\\\.deb$")) | .browser_download_url' \
  | head -1)
if [ -z "$delta_url" ]; then
  echo "no upstream git-delta .deb available for arch $arch — skipping" >&2
else
  curl -fsSL -o /tmp/git-delta.deb "$delta_url"
  apt-get install -y /tmp/git-delta.deb
  rm -f /tmp/git-delta.deb
fi
"""

[os_families.fedora]
[[os_families.fedora.setup]]
run = """
set -euo pipefail
dnf install -y \
  git git-delta curl gcc gcc-c++ make fzf direnv tmux \
  ripgrep jq fd-find tree ShellCheck sqlite
"""
