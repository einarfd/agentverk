name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Pre-flight gate. Runs before any target builds so a bad tag fails
  # in seconds rather than after three matrix legs have burned.
  #
  # Two things are checked here that nothing else checks:
  #   1. The tag matches the version in Cargo.toml. Release binaries
  #      themselves report the tag either way — build.rs derives
  #      `agv --version` from `git describe`. The manifest is what
  #      that falls back to with no .git dir (a source-tarball build)
  #      and what any crates.io publish would carry, so drift there
  #      is invisible until it surfaces somewhere awkward.
  #   2. The tagged commit passes the fast tests. `ci.yml` triggers on
  #      pushes to main and PRs, not on tags, so without this a tag on
  #      a commit that never went green still publishes.
  verify:
    name: Verify tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `^version` only matches the unindented [package] key —
      # dependency tables write theirs indented, so head -1 is the
      # package version and not a dependency's.
      - name: Tag matches Cargo.toml
        run: |
          set -euo pipefail
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$declared" != "$tagged" ]; then
            echo "::error::Cargo.toml declares $declared but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          echo "Cargo.toml $declared matches tag $GITHUB_REF_NAME"

      # Unit tests only — the same subset ci.yml runs on Linux. Enough
      # to catch a tag cut from an unbuildable or broken commit without
      # duplicating the full CI matrix on every release.
      - name: Unit tests
        run: cargo test --lib

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get install -y musl-tools

      - name: Build agv (Rust)
        run: cargo build --release --target ${{ matrix.target }}

      # Every target runs natively on its own runner (musl binaries
      # are static, so they run on the glibc Ubuntu images), so each
      # one can be executed before it ships. install.sh also runs
      # `--version`, but that is after a non-executing binary has
      # already reached the release page.
      - name: Smoke test agv
        run: ./target/${{ matrix.target }}/release/agv --version

      # macOS releases bundle `agv-avf-runner` alongside `agv` so a
      # single install step lays down both binaries. Without this an
      # install on macOS Apple Silicon — where `avf` is the default
      # backend — would get a working `agv` whose default-backend
      # path immediately fails to spawn the runner.
      - name: Install just (macOS only)
        if: matrix.target == 'aarch64-apple-darwin'
        run: brew install just

      - name: Build agv-avf-runner (macOS only)
        if: matrix.target == 'aarch64-apple-darwin'
        run: just build-avf-runner

      # Catches an ad-hoc codesigning failure before publishing —
      # `agv --version` cannot, since agv only spawns the runner at
      # VM-start time. The runner prints its wire-protocol version,
      # which is what `agv doctor` compares against.
      - name: Smoke test agv-avf-runner (macOS only)
        if: matrix.target == 'aarch64-apple-darwin'
        run: swift/avf-runner/.build/release/agv-avf-runner --version

      # Stage binaries into a per-target dir, then tar. Tarballs
      # rather than raw binaries so:
      #   1. The install script has one shape across platforms.
      #   2. macOS ships two binaries (`agv` + `agv-avf-runner`)
      #      without a second download step.
      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/agv-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/agv" "dist/agv-${{ matrix.target }}/agv"
          if [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
            cp "swift/avf-runner/.build/release/agv-avf-runner" \
               "dist/agv-${{ matrix.target }}/agv-avf-runner"
          fi
          tar czf "dist/agv-${{ matrix.target }}.tar.gz" -C dist "agv-${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/agv-${{ matrix.target }}.tar.gz

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum agv-*.tar.gz > checksums.txt

      # A tag with a hyphen (v0.4.0-rc1, v1.0.0-beta) is a
      # pre-release. Without --prerelease, gh marks it `latest`, which
      # is exactly what install.sh downloads — so an rc would land on
      # every fresh install.
      - name: Create GitHub release
        run: |
          set -euo pipefail
          flags=""
          case "$GITHUB_REF_NAME" in
            *-*) flags="--prerelease" ;;
          esac
          gh release create "${{ github.ref_name }}" $flags \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/agv-*.tar.gz \
            artifacts/checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}

  # crates.io publish. Last in the DAG on purpose: publishing a version
  # is irreversible (yank hides it, nothing deletes it), so it only
  # happens once the binaries have built on every target and the GitHub
  # release exists. A failed macOS leg must not leave a crates.io
  # version pointing at a release that was never cut.
  #
  # Only `agv` ships here — `agv-avf-runner` is a Swift binary and cargo
  # has no way to carry it, so a `cargo install agv` on macOS Apple
  # Silicon is deliberately a partial install. The README says so.
  #
  # Auth is crates.io Trusted Publishing (RFC 3691), not a stored API
  # token: GitHub proves this workflow's identity over OIDC and
  # crates-io-auth-action exchanges that for a token good for ~30
  # minutes, which its post step revokes when the job ends. A long-lived
  # `CARGO_REGISTRY_TOKEN` secret would be a standing credential that
  # any action running in this job could read, and its blast radius is
  # everyone who runs `cargo install agv`.
  #
  # The crates.io side is configured per (owner, repo, workflow
  # filename) — einarfd / agentverk / release.yml. Renaming this file
  # breaks publishing until the trusted publisher is updated to match.
  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    # `id-token` is what lets the OIDC exchange happen. Naming any
    # permission drops the rest to none, so `contents: read` has to be
    # spelled out for checkout.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Pre-release tags (v0.4.0-rc1) build binaries and cut a GitHub
      # pre-release, but don't publish. crates.io would accept the
      # semver pre-release and `cargo install` would correctly ignore
      # it, but the version number is then burned forever for a build
      # whose only audience is the tarball channel.
      #
      # The already-published check makes a re-run of this workflow on
      # the same tag a no-op rather than a hard failure, so a transient
      # upload error can be retried from the Actions UI.
      - name: Decide whether to publish
        id: decide
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in
            *-*)
              echo "::notice::$GITHUB_REF_NAME is a pre-release tag — skipping crates.io"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # crates.io rejects API requests without a User-Agent.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: agv-release-workflow (https://github.com/einarfd/agentverk)' \
            "https://crates.io/api/v1/crates/agv/$version")
          if [ "$code" = "200" ]; then
            echo "::notice::agv $version is already on crates.io — skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Minted only when we're actually going to publish, so a skipped
      # run never brings a credential into existence.
      - name: Mint a crates.io token
        id: auth
        if: steps.decide.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@v1

      # --locked so the published build resolves the committed
      # Cargo.lock. release-check.sh already asserts the lock matches
      # Cargo.toml before the tag is pushed, so this is a cheap
      # assertion rather than a new failure mode.
      - name: cargo publish
        if: steps.decide.outputs.publish == 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
