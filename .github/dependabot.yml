# Without this, nothing tells us an action has gone stale. Both
# `actions/checkout` and `actions/download-artifact` sat a major behind
# before anyone noticed, which is the failure mode this exists to catch.
version: 2

updates:
  # Action majors are the ones worth seeing promptly — they carry the
  # runtime and behavioural changes (ESM migrations, stricter defaults).
  # Monthly, because these workflows are small and a weekly PR for a
  # patch bump is noise.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "CI:"

  # Cargo deps grouped into one PR per run. agv pins loosely ("1",
  # "0.22"), so most updates are already picked up at build time and a
  # PR per crate would be pure churn; the group exists to surface the
  # ones that need a manifest edit.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns:
          - "*"
    # serial_test 4 requires rustc 1.93.1, above the `rust-version =
    # "1.85"` this crate declares. It is a dev-dependency, so taking it
    # would break `cargo test` for anyone on an older toolchain while
    # buying nothing — the test-ordering API we use is unchanged. Drop
    # this ignore if the MSRV is ever raised.
    ignore:
      - dependency-name: serial_test
        versions:
          - ">=4"
      # reqwest 0.13 dropped the `webpki-roots` feature and made plain
      # `rustls` bundle aws-lc-rs, which needs cmake and a C toolchain
      # at build time — the two musl legs of the release matrix install
      # only musl-tools. Staying on 0.13 without it means supplying both
      # the crypto provider and the root store by hand through
      # `use_preconfigured_tls`, and a mistake there breaks every image
      # download at runtime, which only the #[ignore]'d boot tests would
      # catch. We use five stable calls from this crate and 0.12 is
      # still maintained, so there is nothing to gain for that risk.
      - dependency-name: reqwest
        versions:
          - ">=0.13"
      # sysinfo 0.37 and up require rustc 1.88, and 0.39 requires 1.95.
      # This is a runtime dependency, so unlike serial_test it would
      # raise the floor for the shipped binary, not just the tests.
      # 0.36 is the newest that still builds on 1.85.
      - dependency-name: sysinfo
        versions:
          - ">=0.37"
