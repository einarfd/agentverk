# OpenClaw AI gateway VM.
# Requires Node.js 22+ — the nodejs mixin is included automatically.
#
# Equivalent command-line:
#   agv create --include devtools --include nodejs --include openclaw <name>

[base]
from = "ubuntu-24.04"  # also works: "debian-12", "fedora-43"
include = ["devtools", "nodejs", "openclaw"]
spec = "large"  # 8G RAM, 4 vCPUs, 40G disk  (run `agv specs` to see all)

# Override individual resource settings if needed:
# [vm]
# memory = "16G"
# cpus = 8
# disk = "80G"

# ── Port forwards (host → VM) ────────────────────────────────────────────────
# Expose VM ports on your host so you can point a browser, db client, or test
# runner at services running inside the VM. `guest` defaults to `host`, and the
# supervisor reconnects automatically if SSH drops. `agv forward` adds the same
# persistent forwards from the command line; declare them here to have them
# apply from the VM's very first start. Each
# `[[forwards]]` block is a root-level table, so it can sit anywhere in the file
# (a bare `forwards = [...]` list must go above the first [section] — see
# docs/config.md#forwards).
#
# [[forwards]]
# host = 8080
#
# [[forwards]]
# host = 5433
# guest = 5432

# ── Repo access ──────────────────────────────────────────────────────────────
# See docs/repo-access.md for the full picture (PAT via gh, SSH key, deploy
# key, agent forwarding). Two quick options:
#
# Option A — gh CLI with a personal access token:
#   Add "gh" to the include list above and put GH_TOKEN=ghp_... in a .env
#   file next to this one. agv runs `gh auth login --with-token` for you.
#
# Option B — SSH key:
#   Add "ssh-key" to the include list above and set
#   SSH_KEY=/path/to/private/key in your .env. agv copies the key in,
#   chmods it, and derives the matching .pub.
